algorithm:
  policy: CustomMultiInputPolicy
  policy_kwargs:
    features_extractor_class: FlexibleExtractor
    features_extractor_kwargs:
      net_arch:
        state:
          layer: [512]
          # ln: True
#          bn: True
        depth:
          channel: [ 32, 64,128]
          kernel_size: 2
          stride: 2
          padding: 1
          layer: [256]

#        depth2:
#          channel: [ 32, 64,128 ]
#          kernel_size: 2
#          stride: 2
#          padding: 1
#          layer: [256]
 #          max_pool: 2
#           ln: True
#          bias: False
#    critic:
#      dist: mse
#      n_critics: 2
#      net_arch:
#        layer: [512, 512]
#        # ln: True
##        bn: True
#    actor:
#      dist: tanh_normal
#      net_arch:
#        layer: [512, 512]
#        # ln: True
    net_arch:
      pi: [512, 512]
      vf: [512, 512]
