env:
  num_agent_per_scene: 10
  num_scene: 10
  max_episode_steps: 768
  scene_kwargs:
#    path: VisFly/datasets/visfly-beta/configs/scenes/box30_wall_empty
    # path: VisFly/datasets/visfly-beta/configs/scenes/box30_wall_median
   path: VisFly/datasets/visfly-beta/configs/scenes/box15_wall_median
#    path: VisFly/datasets/visfly-beta/configs/scenes/box15_wall_empty
  sensor_kwargs:
    - sensor_type: depth
      uuid: depth
      resolution: [12,16]
      position: [0,0,-0.1]

  random_kwargs:
    state_generator:
#       class: Uniform
#       kwargs:
#         - position:
#             mean: [ 30.0, 0.0, 1.5 ]
#             half: [ 1., 1., 0.5]
# #            half: [ 5., 5., 1.0 ]
#           orientation:
#             mean: [0., 0., 0.]
#             half: [0., 0., 3.14]
#          heading: True
      class: Union
      kwargs:
        - randomizers_kwargs:
            - class: Uniform
              kwargs:
                position:
                  mean: [ 2, 0.0, 2.0 ]
                  half: [ 1, 14., 1.0 ]
                orientation:
                  mean: [ 0., 0., 0. ]
                  half: [ 0.5, 0.5, 0.5 ]
                velocity:
                  mean: [ 0.5,0.,0.0 ]
                  half: [ 1.,1.,0.3 ]
                angular_velocity:
                  mean: [ 0.,0.,0. ]
                  half: [ 0.1,0.1,0.1 ]
            - class: Uniform
              kwargs:
                position:
                  mean: [ 28, 0.0, 2.0 ]
                  half: [ 1, 14., 1.0 ]
                orientation:
                  mean: [ 0., 0., 3.14 ]
                  half: [ 0.5, 0.5, 0.5 ]
                velocity:
                  mean: [ 0.5,0.,0.0 ]
                  half: [ 1.,1.,0.3 ]
                angular_velocity:
                  mean: [ 0.,0.,0. ]
                  half: [ 0.1,0.1,0.1 ]
            - class: Uniform
              kwargs:
                position:
                  mean: [ 15, 13, 2.0 ]
                  half: [ 14., 1, 1.0 ]
                orientation:
                  mean: [ 0., 0., -1.57 ]
                  half: [ 0.5, 0.5, 0.5]
                velocity:
                  mean: [ 0., -0.5,0.0 ]
                  half: [ 1.,1.,0.3 ]
                angular_velocity:
                  mean: [ 0.,0.,0. ]
                  half: [ 0.1,0.1,0.1 ]
            - class: Uniform
              kwargs:
                position:
                  mean: [ 15, -13, 2.0 ]
                  half: [ 14., 1, 1.0 ]
                orientation:
                  mean: [ 0., 0., 1.57 ]
                  half: [ 0.5, 0.5, 0.5]
                velocity:
                  mean: [ 0., 0.5,0.0 ]
                  half: [ 1.,1.,0.3 ]
                angular_velocity:
                  mean: [ 0.,0.,0. ]
                  half: [ 0.1,0.1,0.1 ]
  dynamics_kwargs:
    dt: 0.03
    ctrl_dt: 0.03
    comm_delay: 0.06
    ctrl_delay: True
    action_type: "bodyrate"

  visual: True
  device: cpu
  requires_grad: True
  tensor_output: True
  max_rand_velocity: 10.0
  is_collision_reset: False
#  target: [[15,0,1]]

eval_env:
  num_scene: 1
  num_agent_per_scene: 5
  visual: True
  max_episode_steps: 512
  tensor_output: True
  sensor_kwargs:
    - sensor_type: depth
      uuid: depth
      resolution: [ 12,16 ]
      position: [ 0,0,-0.1 ]
    - sensor_type: depth
      uuid: depth2
      resolution: [ 64,64 ]
      position: [ 0,0,-0.1 ]
  random_kwargs:
    state_generator:
      class: Uniform
      kwargs:
        - position:
#            mean: [ 15.0, 0.0, 1 ]
#            half: [ 12., 12., 0.1 ]
            mean: [ 1.0, 0.0, 1 ]
            half: [ 0., 10., 0.2 ]
          orientation:
            mean: [0., 0., 0.]
            half: [0., 0., 1.0]
#          heading: True
          test: True
          xyz_num: [1,5,1]

  scene_kwargs:
#    path: VisFly/datasets/visfly-beta/configs/scenes/box30_wall_empty
#    path: VisFly/datasets/visfly-beta/configs/scenes/box30_wall_low
#    path: VisFly/datasets/visfly-beta/configs/scenes/box15_wall_empty
    path: VisFly/datasets/visfly-beta/configs/scenes/box15_wall_median
#    path: VisFly/datasets/visfly-beta/configs/scenes/box15_wall_simple_pillars
    render_settings:
      mode: fix
#      view: custom
#      position: [[7., 6.8, 5.5], [15, 0, 2.5]]
      resolution: [1080,1080]
      view: top
      position: [[15, 0, 25.5]]
      trajectory: True
      FOV: True
      collision: True
      approaching: True
      axes: True
#  target: [[3,1,0],[3,-1.,0],[3,2,0],[3,0,0],[3,-2,0]]
  target: [[3,0,0]]
#  target: [[5,0,0]]
#  target: [[6,0,0]]

#  target: [[26,-12,1.5],[26,-6,1.5],[26,0,1.5],[26,6,1.5],[26,12,1.5]]
