algorithm:
  policy: SimplePolicy
  policy_kwargs:
    features_extractor_class: StateExtractor
    features_extractor_kwargs:
      net_arch:
        state:
          layer: [512]

    critic:
      dist: mse
      n_critics: 1
      net_arch:
        layer: [512, 512]
    actor:
      dist: normal
#      squash_output: False
      net_arch:
        layer: [512, 512]
#    ln: True
    activation_fn: relu
    optimizer_class: adam
    optimizer_kwargs:
      weight_decay: 0.00001
  learning_rate: 0.005
  horizon: 96
  tau: 0.005
  gamma: 0.99
  device: cuda
  gradient_steps: 10
  train_freq: 96
  batch_size: 25600
  actor_gradient_steps: 1

learn:
  total_timesteps: 3000000
  log_interval: 20

test:
  is_fig: True
  is_fig_save: True
  is_video: True
  is_video_save: True
  render_kwargs: { }