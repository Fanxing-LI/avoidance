
env:
  num_agent_per_scene: 100
  max_episode_steps: 256
  scene_kwargs:
    path: VisFly/datasets/visfly-beta/configs/scenes/box15_wall_empty
  random_kwargs:
    state_generator:
      class: Uniform
      kwargs:
        - position:
            mean: [ 15.0, 0.0, 1 ]
            half: [ 10., 10., 0.2 ]
  dynamics_kwargs:
    dt: 0.03
    ctrl_dt: 0.03
    comm_delay: 0.06
    ctrl_delay: True
    action_type: "bodyrate"
  visual: False
  device: cpu
  requires_grad: True
  tensor_output: True

eval_env:
  num_agent_per_scene: 4
  visual: False
  max_episode_steps: 256
  tensor_output: True
  sensor_kwargs: []
  scene_kwargs:
    path: VisFly/datasets/visfly-beta/configs/scenes/box15_wall_empty
    render_settings:
      mode: fix
      view: top
      resolution: [1080,1080]
      position: [[15., 0., 17], [15, 0, 2.5]]
      trajectory: True
