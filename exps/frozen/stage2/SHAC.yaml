algorithm:
  policy: SimplePolicy
  policy_kwargs:
    features_extractor_class: FlexibleExtractor
    features_extractor_kwargs:
      net_arch:
        state:
          layer: [512]
        depth:
          channel: [ 32, 64,128]
          kernel_size: 2
          stride: 2
          padding: 1
          layer: [256]

    critic:
      dist: mse
      n_critics: 2
      net_arch:
        layer: [512]

    actor:
      dist: tanh_normal
      net_arch:
        layer: [512]


    activation_fn: leaky_relu
    optimizer_class: adamW
    optimizer_kwargs:
      weight_decay: 0.0000
    share_features_extractor: False

  learning_rate:
    class: cosine
    kwargs:
      initial: 0.001
      final: 0.0002
      period: 0.1

  horizon: 256
  tau: 0.005
  gamma: 0.998
  device: cuda
  gradient_steps: 10
  train_freq: 48
  batch_size: 25600
  actor_gradient_steps: 1
  ent_coef: 0.000
  scene_freq: 3000000
#  buffer_reset: True
#  buffer_size: 40000

learn:
  total_timesteps: 120000000
  # log_interval: 20

test:
  is_fig: False
  is_fig_save: True
  is_video: False
  is_video_save: True
  is_sub_video: True
  render_kwargs: { }